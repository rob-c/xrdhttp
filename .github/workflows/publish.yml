# Builds the sdist and wheel on a version tag and uploads them to PyPI through
# trusted publishing (no API token: PyPI trusts this workflow's OIDC identity,
# registered under the project's "Publishing" settings, with the "pypi"
# environment). The wheel is installed from PyPI's own xrdcore before upload,
# so xrdcore must be published first; its ``testing`` extra (xrdsec, which
# ``xrdhttp.testing`` is built on) is installed too, so that every public
# module imports - publish xrdsec before tagging xrdhttp.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Every step but the upload is xrd-devtools' shared publish action: build,
  # `twine check --strict`, the artifact contents (check_dist), then a clean
  # install (with the testing extra) that imports every public module and
  # whose tag, runtime version and dated changelog section agree.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: rob-c/xrd-devtools/.github/actions/publish@main
        with:
          package: xrdhttp
          check-dist: true
          # Every public module is imported from the installed wheel:
          # xrdhttp.s3 needs botocore and xrdhttp.testing needs xrdsec and pytest.
          extras: s3,testing

  # Trusted publishing ties PyPI's trust to this job of this workflow, so the
  # upload stays here, in a job that only downloads what the build staged.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
